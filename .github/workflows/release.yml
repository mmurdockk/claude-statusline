name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'mmurdockk/claude-statusline'
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the plugin version
        run: |
          v="v$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but .claude-plugin/plugin.json says $v"
            exit 1
          fi
      - run: sh tools/test.sh
      - name: Package
        run: |
          name="claude-statusline-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Create GitHub release
        run: |
          cat > notes.md <<'NOTES'
          **Install or update** the Claude Code plugin, then run `/clawdline:setup` once:

          ```bash
          claude plugin install clawdline --marketplace mmurdockk/claude-statusline
          ```

          Without the plugin system: `curl -fsSL https://raw.githubusercontent.com/mmurdockk/claude-statusline/main/install.sh | sh`
          NOTES
          gh release create "$GITHUB_REF_NAME" claude-statusline-*.tar.gz* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
